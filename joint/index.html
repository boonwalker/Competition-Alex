<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Handy-Joint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Fraunces:opsz,wght@9..144,600&family=Rubik:wght@400;600&display=swap">
<style>
/* Layout: Vollbild-Canvas, Joint liegt immer auf der langen Achse; UI schwebt minimal in den Ecken */
:root {
  --bg: #0b0a09;
  --ink: #efe7da;
  --muted: #8f8577;
  --ember: #ff8a2a;
  --display: "Fraunces", Georgia, serif;
  --body: "Rubik", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: none; -webkit-touch-callout: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
html, body { margin: 0; }
[hidden] { display: none !important; }
.settings { width: min(420px, 100%); display: flex; flex-direction: column; gap: 12px; text-align: left; background: rgba(20,18,16,.8); border: 1px solid rgba(255,255,255,.12); border-radius: 18px; padding: 14px; }
.settings .row { display: flex; flex-wrap: wrap; gap: 8px; }
.settings .group { display: flex; flex-direction: column; gap: 6px; }
.settings .lbl, .settings label { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.settings button { font: 600 13px var(--body); color: var(--ink); background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.seg button[aria-checked="true"] { background: var(--ember); color: #1a0d04; border-color: var(--ember); }
.settings input[type=range] { width: 100%; accent-color: var(--ember); }
.cue { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); z-index: 2; font: 600 15px var(--body); color: var(--ink); background: rgba(20,18,16,.75); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 8px 16px; white-space: nowrap; pointer-events: none; }
.hud { position: fixed; left: 16px; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 2; font: 500 12px var(--body); color: var(--muted); background: rgba(20,18,16,.7); border-radius: 8px; padding: 4px 8px; max-width: calc(100% - 32px); pointer-events: none; font-variant-numeric: tabular-nums; }
.settings label.check { display: flex; align-items: center; gap: 8px; margin-top: 6px; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--ink); }
.status { margin: 0; font-size: 13px; line-height: 1.4; color: var(--ink) !important; }
.status:empty { display: none; }
.overlay { position: fixed; inset: 0; overflow-y: auto; padding-block: 24px; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 14px; text-align: center; padding-inline: 16px; z-index: 2; background: radial-gradient(ellipse at center, rgba(11,10,9,.35), rgba(11,10,9,.85)); transition: opacity .8s; }
.overlay.gone { opacity: 0; pointer-events: none; }
.overlay h1 { font-family: var(--display); font-weight: 600; font-size: clamp(30px, 7vw, 56px); margin: 0; line-height: 1; letter-spacing: -.01em; }
.overlay p { margin: 0; color: var(--muted); max-width: 40ch; line-height: 1.45; font-size: 15px; }
.go { font: 600 17px var(--body); color: #1a0d04; background: var(--ember); border: 0; border-radius: 999px; padding: 14px 30px; cursor: pointer; box-shadow: 0 0 40px rgba(255,138,42,.45); }
button:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="cue" id="cue" hidden></div>
<div class="hud" id="micHud" hidden></div>

<div class="overlay" id="start">
  <h1>Handy-Joint</h1>
  <p id="help"></p>
  <button class="go" id="light">🔥 Anzünden</button>
  <div class="settings">
    <div class="group">
      <span class="lbl">Ziehen mit</span>
      <div class="seg" role="radiogroup">
        <button id="modeFinger" role="radio" aria-checked="true">Finger</button>
        <button id="modeBreath" role="radio" aria-checked="false">Atem (Mikrofon)</button>
      </div>
      <div id="micOpts" hidden>
        <label for="micSens">Mikrofon-Empfindlichkeit</label>
        <input type="range" id="micSens" min="0" max="100" value="40">
        <label class="check"><input type="checkbox" id="micHudOn"> Mikro-Analyse im Spiel einblenden</label>
      </div>
    </div>
    <div class="group">
      <span class="lbl">Bewegungssensor: abklopfen &amp; ausdrücken</span>
      <div class="seg" role="radiogroup">
        <button id="knockOff" role="radio" aria-checked="true">Aus</button>
        <button id="knockOn" role="radio" aria-checked="false">An (Bewegungssensor)</button>
      </div>
      <div id="knockOpts" hidden>
        <label for="knockSens">Klopf-Empfindlichkeit</label>
        <input type="range" id="knockSens" min="0" max="100" value="55">
      </div>
    </div>
    <div class="row">
      <button id="flip" title="Filter auf die andere Seite">⇄ Filter links/rechts</button>
      <button id="fs" title="Vollbild">⛶ Vollbild</button>
      <button id="music" aria-pressed="false">♫ Musik: aus</button>
    </div>
    <p class="status" id="status"></p>
  </div>
</div>

<div class="overlay gone" id="end">
  <h1>Aufgeraucht.</h1>
  <p id="endtxt"></p>
  <button class="go" id="again">Neuen drehen</button>
</div>

<script>
const cv = document.getElementById("c"), mainCtx = cv.getContext("2d");
let ctx = mainCtx;   // wird beim Verbiegen kurz auf eine Zwischenebene umgeschaltet
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let bodyPad = 8, W, H, dpr, L, S, r0, r1, x0, fullLen, filterLen, burnStart, burnEnd;
let body, ashTex, smokeSprites = [], frameM, frameInv, smokeLayer = null, sctx = null;
let orient = 0;           // 0: Filter unten rechts, 1: Filter unten links
let UX = 0, UY = -1;      // "oben" auf dem Bildschirm, im Joint-Koordinatensystem
let GX = 0, GY = 1;       // echter Boden beim Halten: zur Bildschirmseite gegenüber dem Filter (Filter rechts -> Boden links)
let state = "unlit";      // unlit | lighting | lit | out
let bx, ashStart, heat = 0, drawing = false, drawStart = 0, drawTime = 0, totalDrags = 0, haze = 0, lightT = 0;
let flakes = [], lastBurnT = 0, ashLimit = 3, smoke = [], sparks = [], ashFall = [], emberDots = [];
const seeds = [rand(0, 9), rand(0, 9), rand(0, 9)];

// ---------- Geometrie ----------
function radius(x) {
  // handgedreht: nicht ganz linear, mit leichtem Bauch hinter der Mitte
  const u = clamp((x - x0) / fullLen, 0, 1);
  return r0 + (r1 - r0) * u + r1 * .07 * Math.sin(Math.PI * Math.pow(u, .8));
}
// Unregelmäßigkeiten der Ober- und Unterkante (Crutch bleibt glatt, der ist aus Karton)
function wob(x, sd) {
  const u = (x - x0) / fullLen, xl = x - x0;
  const on = clamp((xl - filterLen) / 25, 0, 1);
  return on * r1 * (.04 * Math.sin(u * 9.1 + sd) + .028 * Math.sin(u * 23.7 + sd * 2.3) + .016 * Math.sin(u * 51 + sd * 1.7));
}
const topY = x => -(radius(x) + wob(x, seeds[0]));
const botY = x => radius(x) + wob(x, seeds[1] + 2);

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  L = Math.hypot(W, H); S = Math.min(W, H);
  r1 = Math.min(S * 0.085, L * 0.042); r0 = r1 * 0.74;
  x0 = -L / 2 - 6; fullLen = L * 0.9; filterLen = fullLen * 0.16;
  burnStart = x0 + fullLen; burnEnd = x0 + filterLen + L * 0.025;
  if (state === "unlit") { bx = burnStart; ashStart = bx; }
  bx = clamp(bx ?? burnStart, burnEnd, burnStart); ashStart = Math.max(ashStart ?? bx, bx);
  bodyPad = Math.ceil(r1 * .3) + 4;
  buildBody(); buildAsh(); buildSmoke(); buildEmberDots(); buildFrame();
}

function buildFrame() {
  // Joint-Achse = Bildschirmdiagonale, vom Filter-Eck unten zur gegenüberliegenden oberen Ecke
  const dx = orient ? W : -W, dy = -H, th = Math.atan2(dy, dx);
  frameM = new DOMMatrix().translate(W / 2, H / 2).rotate(th * 180 / Math.PI);
  if (-Math.cos(th) > 0) frameM = frameM.scale(1, -1);   // Oberseite des Joints zeigt nach oben
  frameInv = frameM.inverse();
  const a = frameInv.transformPoint(new DOMPoint(W / 2, H / 2)), b = frameInv.transformPoint(new DOMPoint(W / 2, H / 2 - 1));
  UX = b.x - a.x; UY = b.y - a.y;
  const g = frameInv.transformPoint(new DOMPoint(W / 2 + (orient ? 1 : -1), H / 2));
  GX = g.x - a.x; GY = g.y - a.y;
}

// ---------- Papier, Füllung, Crutch (einmal vorgerendert) ----------
function conePath(c, ox, oy) {
  c.beginPath();
  for (let xl = 0; xl <= fullLen; xl += 3) c.lineTo(ox + xl, oy + topY(x0 + xl));
  for (let xl = fullLen; xl >= 0; xl -= 3) c.lineTo(ox + xl, oy + botY(x0 + xl));
  c.closePath();
}
function buildBody() {
  const pad = bodyPad, bw = Math.ceil(fullLen), bh = Math.ceil(r1 * 2 + pad * 2);
  const oy = bh / 2;
  const mk = () => { const k = document.createElement("canvas"); k.width = bw * dpr; k.height = bh * dpr; const c = k.getContext("2d"); c.scale(dpr, dpr); return [k, c]; };
  // 1) Füllung: Krümel, Blattstücke, Stängel – sitzt unter dem Papier
  const [fk, f] = mk();
  f.fillStyle = "#6a5636"; f.fillRect(0, 0, bw, bh);
  const dens = x => .55 + .45 * (Math.sin(x * .021 + seeds[0]) * .5 + Math.sin(x * .053 + seeds[1]) * .3 + Math.sin(x * .11) * .2);
  const crumb = ["#2e2414", "#6d5733", "#a08a58", "#4a4d29", "#1f1b10", "#b39d6a", "#5e5a2f", "#7a5e34", "#c2ae7e"];
  for (let i = 0; i < bw * bh * .9; i++) {
    const x = rand(filterLen, bw), y = rand(0, bh);
    if (Math.random() > dens(x) + .25) continue;
    f.fillStyle = crumb[(Math.random() * crumb.length) | 0];
    f.globalAlpha = rand(.55, 1);
    f.save(); f.translate(x, y); f.rotate(rand(0, 3.14));
    f.fillRect(-rand(.4, 1.6), -rand(.3, 1), rand(.8, 3.2), rand(.6, 2));
    f.restore();
  }
  // größere, unregelmäßige Blattstücke
  const leaf = ["#3b3a1e", "#57502a", "#6e5c33", "#2c2615", "#847046", "#4d5428"];
  for (let i = 0; i < bw * bh * .035; i++) {
    const x = rand(filterLen, bw), y = rand(0, bh), r = rand(1.5, 4.5), k = 4 + (Math.random() * 4 | 0);
    f.globalAlpha = rand(.35, .8); f.fillStyle = leaf[(Math.random() * leaf.length) | 0];
    f.beginPath();
    for (let j = 0; j < k; j++) { const a = j / k * 6.283 + rand(-.3, .3), rr = r * rand(.45, 1.1); f.lineTo(x + Math.cos(a) * rr * 1.4, y + Math.sin(a) * rr); }
    f.closePath(); f.fill();
  }
  f.globalAlpha = 1; f.lineCap = "round";
  for (let i = 0; i < bw * .25; i++) {
    const x = rand(filterLen, bw), y = rand(0, bh), a = rand(-.5, .5), len = rand(3, 12);
    f.strokeStyle = Math.random() < .6 ? "rgba(168,148,98,.8)" : "rgba(40,32,18,.8)"; f.lineWidth = rand(.5, 1.2);
    f.beginPath(); f.moveTo(x, y); f.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); f.stroke();
  }
  // Crutch: aufgerollter Karton statt Füllung
  f.fillStyle = "#cdbd98"; f.fillRect(0, 0, filterLen, bh);
  f.strokeStyle = "rgba(120,98,66,.55)"; f.lineWidth = 1.3;
  for (let k = 0; k < 3; k++) {
    f.beginPath(); const x = filterLen * (0.25 + k * 0.25);
    for (let j = 0; j <= 6; j++) f.lineTo(x + (j % 2 ? 6 : -6), oy - r0 + (j / 6) * r0 * 2);
    f.stroke();
  }

  body = mk()[0];
  const c = body.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.save(); conePath(c, 0, oy); c.clip();
  // Papier liegt leicht diffus über der Füllung
  try { c.filter = "blur(0.35px)"; } catch (e) {}
  c.drawImage(fk, 0, 0, bw, bh);
  c.filter = "none";
  // 2) Dünnes Zigarettenpapier: halbtransparent, warm-grau
  c.fillStyle = "rgba(238,229,208,.34)"; c.fillRect(0, 0, bw, bh);
  // Papier ist nicht überall gleich dick: wolkige, längs gezogene Struktur (dort schimmert mal mehr, mal weniger Tabak durch)
  const cloud = (cw, ch, alpha) => {
    const nw = Math.max(2, Math.ceil(bw / cw)), nh = Math.max(2, Math.ceil(bh / ch));
    const k = document.createElement("canvas"); k.width = nw; k.height = nh;
    const kc = k.getContext("2d"), im = kc.createImageData(nw, nh);
    for (let i = 0; i < im.data.length; i += 4) { im.data[i] = 240; im.data[i + 1] = 232; im.data[i + 2] = 212; im.data[i + 3] = Math.pow(Math.random(), 1.6) * 255; }
    kc.putImageData(im, 0, 0);
    c.save(); c.globalAlpha = alpha; c.imageSmoothingEnabled = true; c.imageSmoothingQuality = "high";
    c.drawImage(k, 0, 0, bw, bh); c.restore();
  };
  cloud(26, 7, .26); cloud(9, 3.5, .2); cloud(3.5, 2, .12);
  // feine Papierfasern
  for (let i = 0; i < bw * 1.4; i++) {
    const x = rand(0, bw), y = rand(0, bh), a = rand(-.6, .6) + (Math.random() < .3 ? rand(-1.5, 1.5) : 0), len = rand(1.5, 6);
    c.strokeStyle = `rgba(250,244,228,${rand(.06, .16)})`; c.lineWidth = rand(.25, .55);
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); c.stroke();
  }
  c.fillStyle = "rgba(240,232,214,.45)"; c.fillRect(0, 0, filterLen, bh);
  // Wasserzeichen-Linien quer zum Papier
  c.strokeStyle = "rgba(255,250,235,.07)"; c.lineWidth = 1;
  for (let x = 2; x < bw; x += 5.5) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x + 1, bh); c.stroke(); }
  // Doppellage an der Klebenaht
  const sy = oy - r1 * .38;
  c.fillStyle = "rgba(220,208,178,.28)"; c.beginPath(); c.moveTo(0, oy - r0 * .38); c.lineTo(bw, sy); c.lineTo(bw, sy + r1 * .22); c.lineTo(0, oy - r0 * .38 + r0 * .22); c.fill();
  c.strokeStyle = "rgba(120,100,70,.35)"; c.lineWidth = .8;
  c.beginPath(); c.moveTo(0, oy - r0 * .38); c.lineTo(bw, sy); c.stroke();
  // Knitterfalten
  for (let i = 0; i < 45; i++) {
    const x = rand(filterLen, bw), y = oy + rand(-.8, .8) * r1, len = rand(5, 18), a = rand(-1.1, 1.1);
    c.lineWidth = rand(.5, 1);
    c.strokeStyle = "rgba(255,248,230,.16)";
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); c.stroke();
    c.strokeStyle = "rgba(40,30,15,.12)";
    c.beginPath(); c.moveTo(x + .8, y + 1); c.lineTo(x + .8 + Math.cos(a) * len, y + 1 + Math.sin(a) * len); c.stroke();
  }
  // Zylinder-Schattierung, Spalte für Spalte (Kegelform)
  for (let x = 0; x < bw; x += 2) {
    const ty = oy + topY(x0 + x), by = oy + botY(x0 + x), r = (by - ty) / 2, oyc = (ty + by) / 2;
    const rim = c.createLinearGradient(0, oyc - r, 0, oyc + r);
    rim.addColorStop(0, "rgba(236,228,208,.42)"); rim.addColorStop(.22, "rgba(236,228,208,.06)");
    rim.addColorStop(.5, "rgba(236,228,208,0)"); rim.addColorStop(.8, "rgba(236,228,208,.06)"); rim.addColorStop(1, "rgba(236,228,208,.3)");
    c.fillStyle = rim; c.fillRect(x, oyc - r, 2, r * 2);
    const g = c.createLinearGradient(0, oyc - r, 0, oyc + r);
    g.addColorStop(0, "rgba(30,22,12,.55)");
    g.addColorStop(.14, "rgba(30,22,12,.08)");
    g.addColorStop(.3, "rgba(255,248,230,.22)");
    g.addColorStop(.45, "rgba(255,248,230,0)");
    g.addColorStop(.75, "rgba(25,18,8,.22)");
    g.addColorStop(1, "rgba(10,7,3,.8)");
    c.fillStyle = g; c.fillRect(x, oyc - r, 2, r * 2);
  }
  c.restore();
  // 3) Papierkorn auf Pixelebene
  const id = c.getImageData(0, 0, body.width, body.height), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    if (!d[i + 3]) continue;
    const n = (Math.random() - .5) * 14;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  c.putImageData(id, 0, 0);
}

function buildAsh() {
  const w = Math.ceil(r1 * 10), h = Math.ceil(r1 * 2.2);
  ashTex = document.createElement("canvas"); ashTex.width = w * 2; ashTex.height = h * 2;
  const c = ashTex.getContext("2d"); c.scale(2, 2);
  c.fillStyle = "#9a958d"; c.fillRect(0, 0, w, h);
  // Brennschichten: feine Ringe quer zur Achse
  for (let x = 0; x < w; x += rand(2.5, 6)) {
    c.strokeStyle = `rgba(${rand(25, 50) | 0},${rand(22, 45) | 0},${rand(20, 40) | 0},${rand(.15, .4)})`; c.lineWidth = rand(.3, 1);
    c.beginPath(); c.moveTo(x, 0);
    for (let y = 0; y <= h; y += h / 6) c.lineTo(x + rand(-1.2, 1.2), y);
    c.stroke();
  }
  // feine Körnung
  for (let i = 0; i < w * h * .9; i++) {
    const v = rand(70, 205) | 0;
    c.fillStyle = `rgba(${v},${v - 3},${v - 8},${rand(.25, .7)})`;
    c.fillRect(rand(0, w), rand(0, h), rand(.4, 1.2), rand(.4, 1.1));
  }
  // helle Ascheflocken mit Schattenkante
  for (let i = 0; i < w * h * .02; i++) {
    const x = rand(0, w), y = rand(0, h), r = rand(.8, 2.6), k = 4 + (Math.random() * 3 | 0), pts = [];
    for (let j = 0; j < k; j++) { const a = j / k * 6.283 + rand(-.3, .3); pts.push([x + Math.cos(a) * r * rand(.6, 1.2), y + Math.sin(a) * r * rand(.4, .9)]); }
    c.beginPath(); pts.forEach(q => c.lineTo(q[0] + .5, q[1] + .6)); c.closePath(); c.fillStyle = "rgba(30,28,26,.35)"; c.fill();
    c.beginPath(); pts.forEach(q => c.lineTo(q[0], q[1])); c.closePath(); c.fillStyle = `rgba(${rand(175, 215) | 0},${rand(170, 208) | 0},${rand(160, 198) | 0},${rand(.45, .85)})`; c.fill();
  }
  // schwarze Kohlepünktchen
  for (let i = 0; i < w * h * .01; i++) { c.fillStyle = `rgba(15,12,10,${rand(.3, .7)})`; c.beginPath(); c.arc(rand(0, w), rand(0, h), rand(.3, .9), 0, 7); c.fill(); }
  // feine Haarrisse
  c.lineCap = "round";
  for (let i = 0; i < w * .25; i++) {
    c.strokeStyle = `rgba(25,22,20,${rand(.3, .65)})`; c.lineWidth = rand(.3, .7);
    let x = rand(0, w), y = rand(0, h); c.beginPath(); c.moveTo(x, y);
    for (let j = 0; j < 4; j++) { x += rand(-2.5, 2.5); y += rand(-4, 4); c.lineTo(x, y); }
    c.stroke();
  }
}

function buildSmoke() {
  // Vier Varianten: Value-Noise (mehrere Oktaven) × weicher radialer Abfall
  smokeSprites = [];
  const N = 96;
  for (let v = 0; v < 8; v++) {
    const tint = v < 4 ? [150, 156, 166] : [206, 209, 215];   // 0–3 grauer Rauch, 4–7 hellere Schwaden
    const k = document.createElement("canvas"); k.width = k.height = N;
    const c = k.getContext("2d"), img = c.createImageData(N, N), d = img.data;
    const oct = [8, 16, 32].map(g => { const a = []; for (let i = 0; i < (g + 1) * (g + 1); i++) a.push(Math.random()); return { g, a }; });
    const sm = x => x * x * (3 - 2 * x);
    const vn = (o, x, y) => { const gx = x * o.g, gy = y * o.g, ix = Math.floor(gx), iy = Math.floor(gy), fx = sm(gx - ix), fy = sm(gy - iy), w = o.g + 1;
      const A = o.a[iy * w + ix], B = o.a[iy * w + ix + 1], C = o.a[(iy + 1) * w + ix], D = o.a[(iy + 1) * w + ix + 1];
      return A + (B - A) * fx + (C - A) * fy + (A - B - C + D) * fx * fy; };
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const u = x / N, w = y / N, dx = u - .5, dy = w - .5, r = Math.sqrt(dx * dx + dy * dy) * 2;
      const fall = Math.max(0, 1 - r); 
      const n = vn(oct[0], u, w) * .55 + vn(oct[1], u, w) * .3 + vn(oct[2], u, w) * .15;
