<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Handy-Joint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Rubik:wght@400;600&display=swap">
<style>
/* Layout: Vollbild-Canvas, Joint liegt immer auf der langen Achse; UI schwebt minimal in den Ecken */
:root {
  --bg: #0b0a09;
  --ink: #efe7da;
  --muted: #8f8577;
  --ember: #ff8a2a;
  --display: "Fraunces", Georgia, serif;
  --body: "Rubik", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: none; -webkit-touch-callout: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
html, body { margin: 0; }
[hidden] { display: none !important; }
.settings { width: min(420px, 100%); display: flex; flex-direction: column; gap: 12px; text-align: left; background: rgba(20,18,16,.8); border: 1px solid rgba(255,255,255,.12); border-radius: 18px; padding: 14px; }
.settings .row { display: flex; flex-wrap: wrap; gap: 8px; }
.settings .group { display: flex; flex-direction: column; gap: 6px; }
.settings .lbl, .settings label { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.settings button { font: 600 13px var(--body); color: var(--ink); background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.seg button[aria-checked="true"] { background: var(--ember); color: #1a0d04; border-color: var(--ember); }
.settings input[type=range] { width: 100%; accent-color: var(--ember); }
.cue { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); z-index: 2; font: 600 15px var(--body); color: var(--ink); background: rgba(20,18,16,.75); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 8px 16px; white-space: nowrap; pointer-events: none; }
.hud { position: fixed; left: 16px; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 2; font: 500 12px var(--body); color: var(--muted); background: rgba(20,18,16,.7); border-radius: 8px; padding: 4px 8px; max-width: calc(100% - 32px); pointer-events: none; font-variant-numeric: tabular-nums; }
.settings label.check { display: flex; align-items: center; gap: 8px; margin-top: 6px; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--ink); }
.status { margin: 0; font-size: 13px; line-height: 1.4; color: var(--ink) !important; }
.status:empty { display: none; }
.overlay { position: fixed; inset: 0; overflow-y: auto; padding-block: 24px; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 14px; text-align: center; padding-inline: 16px; z-index: 2; background: radial-gradient(ellipse at center, rgba(11,10,9,.35), rgba(11,10,9,.85)); transition: opacity .8s; }
.overlay.gone { opacity: 0; pointer-events: none; }
.overlay h1 { font-family: var(--display); font-weight: 600; font-size: clamp(30px, 7vw, 56px); margin: 0; line-height: 1; letter-spacing: -.01em; }
.overlay p { margin: 0; color: var(--muted); max-width: 40ch; line-height: 1.45; font-size: 15px; }
.go { font: 600 17px var(--body); color: #1a0d04; background: var(--ember); border: 0; border-radius: 999px; padding: 14px 30px; cursor: pointer; box-shadow: 0 0 40px rgba(255,138,42,.45); }
button:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="cue" id="cue" hidden></div>
<div class="hud" id="micHud" hidden></div>

<div class="overlay" id="start">
  <h1>Handy-Joint</h1>
  <p id="help"></p>
  <button class="go" id="light">🔥 Anzünden</button>
  <div class="settings">
    <div class="group">
      <span class="lbl">Ziehen mit</span>
      <div class="seg" role="radiogroup">
        <button id="modeFinger" role="radio" aria-checked="true">Finger</button>
        <button id="modeBreath" role="radio" aria-checked="false">Atem (Mikrofon)</button>
      </div>
      <div id="micOpts" hidden>
        <label for="micSens">Mikrofon-Empfindlichkeit</label>
        <input type="range" id="micSens" min="0" max="100" value="40">
        <label class="check"><input type="checkbox" id="micHudOn"> Mikro-Analyse im Spiel einblenden</label>
      </div>
    </div>
    <div class="group">
      <span class="lbl">Asche abklopfen</span>
      <div class="seg" role="radiogroup">
        <button id="knockOff" role="radio" aria-checked="true">Aus</button>
        <button id="knockOn" role="radio" aria-checked="false">An (Bewegungssensor)</button>
      </div>
      <div id="knockOpts" hidden>
        <label for="knockSens">Klopf-Empfindlichkeit</label>
        <input type="range" id="knockSens" min="0" max="100" value="55">
      </div>
    </div>
    <div class="row">
      <button id="flip" title="Filter auf die andere Seite">⇄ Filter links/rechts</button>
      <button id="fs" title="Vollbild">⛶ Vollbild</button>
    </div>
    <p class="status" id="status"></p>
  </div>
</div>

<div class="overlay gone" id="end">
  <h1>Aufgeraucht.</h1>
  <p id="endtxt"></p>
  <button class="go" id="again">Neuen drehen</button>
</div>

<script>
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let W, H, dpr, L, S, r0, r1, x0, fullLen, filterLen, burnStart, burnEnd;
let body, ashTex, smokeSprites = [], frameM, frameInv, smokeLayer = null, sctx = null;
let orient = 0;           // 0: Filter unten rechts, 1: Filter unten links
let UX = 0, UY = -1;      // "oben" auf dem Bildschirm, im Joint-Koordinatensystem
let state = "unlit";      // unlit | lighting | lit | out
let bx, ashStart, heat = 0, drawing = false, drawStart = 0, drawTime = 0, totalDrags = 0, haze = 0, lightT = 0;
let ashLimit = 3, smoke = [], sparks = [], ashFall = [], emberDots = [];
const seeds = [rand(0, 9), rand(0, 9), rand(0, 9)];

// ---------- Geometrie ----------
function radius(x) { return r0 + (r1 - r0) * clamp((x - x0) / fullLen, 0, 1); }

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  L = Math.hypot(W, H); S = Math.min(W, H);
  r1 = Math.min(S * 0.085, L * 0.042); r0 = r1 * 0.74;
  x0 = -L / 2 - 6; fullLen = L * 0.9; filterLen = fullLen * 0.16;
  burnStart = x0 + fullLen; burnEnd = x0 + filterLen + L * 0.025;
  if (state === "unlit") { bx = burnStart; ashStart = bx; }
  bx = clamp(bx ?? burnStart, burnEnd, burnStart); ashStart = Math.max(ashStart ?? bx, bx);
  buildBody(); buildAsh(); buildSmoke(); buildEmberDots(); buildFrame();
}

function buildFrame() {
  // Joint-Achse = Bildschirmdiagonale, vom Filter-Eck unten zur gegenüberliegenden oberen Ecke
  const dx = orient ? W : -W, dy = -H, th = Math.atan2(dy, dx);
  frameM = new DOMMatrix().translate(W / 2, H / 2).rotate(th * 180 / Math.PI);
  if (-Math.cos(th) > 0) frameM = frameM.scale(1, -1);   // Oberseite des Joints zeigt nach oben
  frameInv = frameM.inverse();
  const a = frameInv.transformPoint(new DOMPoint(W / 2, H / 2)), b = frameInv.transformPoint(new DOMPoint(W / 2, H / 2 - 1));
  UX = b.x - a.x; UY = b.y - a.y;
}

// ---------- Papier, Füllung, Crutch (einmal vorgerendert) ----------
function conePath(c, ox, oy) {
  c.beginPath();
  c.moveTo(ox, oy - r0); c.lineTo(ox + fullLen, oy - r1);
  c.lineTo(ox + fullLen, oy + r1); c.lineTo(ox, oy + r0); c.closePath();
}
function buildBody() {
  const pad = 4, bw = Math.ceil(fullLen), bh = Math.ceil(r1 * 2 + pad * 2);
  const oy = bh / 2;
  const mk = () => { const k = document.createElement("canvas"); k.width = bw * dpr; k.height = bh * dpr; const c = k.getContext("2d"); c.scale(dpr, dpr); return [k, c]; };
  // 1) Füllung: Krümel, Blattstücke, Stängel – sitzt unter dem Papier
  const [fk, f] = mk();
  f.fillStyle = "#6a5636"; f.fillRect(0, 0, bw, bh);
  const dens = x => .55 + .45 * (Math.sin(x * .021 + seeds[0]) * .5 + Math.sin(x * .053 + seeds[1]) * .3 + Math.sin(x * .11) * .2);
  const crumb = ["#2e2414", "#6d5733", "#a08a58", "#4a4d29", "#1f1b10", "#b39d6a", "#5e5a2f", "#7a5e34", "#c2ae7e"];
  for (let i = 0; i < bw * bh * .9; i++) {
    const x = rand(filterLen, bw), y = rand(0, bh);
    if (Math.random() > dens(x) + .25) continue;
    f.fillStyle = crumb[(Math.random() * crumb.length) | 0];
    f.globalAlpha = rand(.55, 1);
    f.save(); f.translate(x, y); f.rotate(rand(0, 3.14));
    f.fillRect(-rand(.4, 1.6), -rand(.3, 1), rand(.8, 3.2), rand(.6, 2));
    f.restore();
  }
  // größere, unregelmäßige Blattstücke
  const leaf = ["#3b3a1e", "#57502a", "#6e5c33", "#2c2615", "#847046", "#4d5428"];
  for (let i = 0; i < bw * bh * .035; i++) {
    const x = rand(filterLen, bw), y = rand(0, bh), r = rand(1.5, 4.5), k = 4 + (Math.random() * 4 | 0);
    f.globalAlpha = rand(.35, .8); f.fillStyle = leaf[(Math.random() * leaf.length) | 0];
    f.beginPath();
    for (let j = 0; j < k; j++) { const a = j / k * 6.283 + rand(-.3, .3), rr = r * rand(.45, 1.1); f.lineTo(x + Math.cos(a) * rr * 1.4, y + Math.sin(a) * rr); }
    f.closePath(); f.fill();
  }
  f.globalAlpha = 1; f.lineCap = "round";
  for (let i = 0; i < bw * .25; i++) {
    const x = rand(filterLen, bw), y = rand(0, bh), a = rand(-.5, .5), len = rand(3, 12);
    f.strokeStyle = Math.random() < .6 ? "rgba(168,148,98,.8)" : "rgba(40,32,18,.8)"; f.lineWidth = rand(.5, 1.2);
    f.beginPath(); f.moveTo(x, y); f.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); f.stroke();
  }
  // Crutch: aufgerollter Karton statt Füllung
  f.fillStyle = "#cdbd98"; f.fillRect(0, 0, filterLen, bh);
  f.strokeStyle = "rgba(120,98,66,.55)"; f.lineWidth = 1.3;
  for (let k = 0; k < 3; k++) {
    f.beginPath(); const x = filterLen * (0.25 + k * 0.25);
    for (let j = 0; j <= 6; j++) f.lineTo(x + (j % 2 ? 6 : -6), oy - r0 + (j / 6) * r0 * 2);
    f.stroke();
  }

  body = mk()[0];
  const c = body.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.save(); conePath(c, 0, oy); c.clip();
  // Papier liegt leicht diffus über der Füllung
  try { c.filter = "blur(0.35px)"; } catch (e) {}
  c.drawImage(fk, 0, 0, bw, bh);
  c.filter = "none";
  // 2) Dünnes Zigarettenpapier: halbtransparent, warm-grau
  c.fillStyle = "rgba(238,229,208,.34)"; c.fillRect(0, 0, bw, bh);
  // Papier ist nicht überall gleich dick: wolkige, längs gezogene Struktur (dort schimmert mal mehr, mal weniger Tabak durch)
  const cloud = (cw, ch, alpha) => {
    const nw = Math.max(2, Math.ceil(bw / cw)), nh = Math.max(2, Math.ceil(bh / ch));
    const k = document.createElement("canvas"); k.width = nw; k.height = nh;
    const kc = k.getContext("2d"), im = kc.createImageData(nw, nh);
    for (let i = 0; i < im.data.length; i += 4) { im.data[i] = 240; im.data[i + 1] = 232; im.data[i + 2] = 212; im.data[i + 3] = Math.pow(Math.random(), 1.6) * 255; }
    kc.putImageData(im, 0, 0);
    c.save(); c.globalAlpha = alpha; c.imageSmoothingEnabled = true; c.imageSmoothingQuality = "high";
    c.drawImage(k, 0, 0, bw, bh); c.restore();
  };
  cloud(26, 7, .26); cloud(9, 3.5, .2); cloud(3.5, 2, .12);
  // feine Papierfasern
  for (let i = 0; i < bw * 1.4; i++) {
    const x = rand(0, bw), y = rand(0, bh), a = rand(-.6, .6) + (Math.random() < .3 ? rand(-1.5, 1.5) : 0), len = rand(1.5, 6);
    c.strokeStyle = `rgba(250,244,228,${rand(.06, .16)})`; c.lineWidth = rand(.25, .55);
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); c.stroke();
  }
  c.fillStyle = "rgba(240,232,214,.45)"; c.fillRect(0, 0, filterLen, bh);
  // Wasserzeichen-Linien quer zum Papier
  c.strokeStyle = "rgba(255,250,235,.07)"; c.lineWidth = 1;
  for (let x = 2; x < bw; x += 5.5) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x + 1, bh); c.stroke(); }
  // Doppellage an der Klebenaht
  const sy = oy - r1 * .38;
  c.fillStyle = "rgba(220,208,178,.28)"; c.beginPath(); c.moveTo(0, oy - r0 * .38); c.lineTo(bw, sy); c.lineTo(bw, sy + r1 * .22); c.lineTo(0, oy - r0 * .38 + r0 * .22); c.fill();
  c.strokeStyle = "rgba(120,100,70,.35)"; c.lineWidth = .8;
  c.beginPath(); c.moveTo(0, oy - r0 * .38); c.lineTo(bw, sy); c.stroke();
  // Knitterfalten
  for (let i = 0; i < 45; i++) {
    const x = rand(filterLen, bw), y = oy + rand(-.8, .8) * r1, len = rand(5, 18), a = rand(-1.1, 1.1);
    c.lineWidth = rand(.5, 1);
    c.strokeStyle = "rgba(255,248,230,.16)";
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); c.stroke();
    c.strokeStyle = "rgba(40,30,15,.12)";
    c.beginPath(); c.moveTo(x + .8, y + 1); c.lineTo(x + .8 + Math.cos(a) * len, y + 1 + Math.sin(a) * len); c.stroke();
  }
  // Zylinder-Schattierung, Spalte für Spalte (Kegelform)
  for (let x = 0; x < bw; x += 2) {
    const r = r0 + (r1 - r0) * (x / fullLen);
    const rim = c.createLinearGradient(0, oy - r, 0, oy + r);
    rim.addColorStop(0, "rgba(236,228,208,.42)"); rim.addColorStop(.22, "rgba(236,228,208,.06)");
    rim.addColorStop(.5, "rgba(236,228,208,0)"); rim.addColorStop(.8, "rgba(236,228,208,.06)"); rim.addColorStop(1, "rgba(236,228,208,.3)");
    c.fillStyle = rim; c.fillRect(x, oy - r, 2, r * 2);
    const g = c.createLinearGradient(0, oy - r, 0, oy + r);
    g.addColorStop(0, "rgba(30,22,12,.55)");
    g.addColorStop(.14, "rgba(30,22,12,.08)");
    g.addColorStop(.3, "rgba(255,248,230,.22)");
    g.addColorStop(.45, "rgba(255,248,230,0)");
    g.addColorStop(.75, "rgba(25,18,8,.22)");
    g.addColorStop(1, "rgba(10,7,3,.8)");
    c.fillStyle = g; c.fillRect(x, oy - r, 2, r * 2);
  }
  c.restore();
  // 3) Papierkorn auf Pixelebene
  const id = c.getImageData(0, 0, body.width, body.height), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    if (!d[i + 3]) continue;
    const n = (Math.random() - .5) * 14;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  c.putImageData(id, 0, 0);
}

function buildAsh() {
  const w = Math.ceil(r1 * 10), h = Math.ceil(r1 * 2.2);
  ashTex = document.createElement("canvas"); ashTex.width = w; ashTex.height = h;
  const c = ashTex.getContext("2d");
  c.fillStyle = "#8c867e"; c.fillRect(0, 0, w, h);
  for (let i = 0; i < 2500; i++) {
    const v = Math.floor(rand(60, 190));
    c.fillStyle = `rgba(${v},${v - 4},${v - 10},${rand(.15, .5)})`;
    c.fillRect(rand(0, w), rand(0, h), rand(1, 4), rand(1, 3));
  }
  // Risse und Ringe der Asche
  c.lineCap = "round";
  for (let i = 0; i < 60; i++) {
    c.strokeStyle = `rgba(30,28,26,${rand(.3, .7)})`; c.lineWidth = rand(.6, 1.8);
    let x = rand(0, w), y = rand(0, h);
    c.beginPath(); c.moveTo(x, y);
    for (let j = 0; j < 5; j++) { x += rand(-6, 6); y += rand(-10, 10); c.lineTo(x, y); }
    c.stroke();
  }
  for (let x = 0; x < w; x += rand(6, 18)) {
    c.strokeStyle = `rgba(35,32,30,${rand(.2, .45)})`; c.lineWidth = rand(.8, 2);
    c.beginPath(); c.moveTo(x, 0); c.bezierCurveTo(x + rand(-5, 5), h * .3, x + rand(-5, 5), h * .7, x + rand(-4, 4), h); c.stroke();
  }
}

function buildSmoke() {
  // Vier Varianten: Value-Noise (mehrere Oktaven) × weicher radialer Abfall
  smokeSprites = [];
  const N = 96;
  for (let v = 0; v < 8; v++) {
    const tint = v < 4 ? [150, 156, 166] : [206, 209, 215];   // 0–3 grauer Rauch, 4–7 hellere Schwaden
    const k = document.createElement("canvas"); k.width = k.height = N;
    const c = k.getContext("2d"), img = c.createImageData(N, N), d = img.data;
    const oct = [8, 16, 32].map(g => { const a = []; for (let i = 0; i < (g + 1) * (g + 1); i++) a.push(Math.random()); return { g, a }; });
    const sm = x => x * x * (3 - 2 * x);
    const vn = (o, x, y) => { const gx = x * o.g, gy = y * o.g, ix = Math.floor(gx), iy = Math.floor(gy), fx = sm(gx - ix), fy = sm(gy - iy), w = o.g + 1;
      const A = o.a[iy * w + ix], B = o.a[iy * w + ix + 1], C = o.a[(iy + 1) * w + ix], D = o.a[(iy + 1) * w + ix + 1];
      return A + (B - A) * fx + (C - A) * fy + (A - B - C + D) * fx * fy; };
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const u = x / N, w = y / N, dx = u - .5, dy = w - .5, r = Math.sqrt(dx * dx + dy * dy) * 2;
      const fall = Math.max(0, 1 - r); 
      const n = vn(oct[0], u, w) * .55 + vn(oct[1], u, w) * .3 + vn(oct[2], u, w) * .15;
      const a = Math.pow(fall, 1.6) * Math.pow(Math.max(0, n - .25) / .75, 1.4);
      const i = (y * N + x) * 4;
      d[i] = tint[0]; d[i + 1] = tint[1]; d[i + 2] = tint[2]; d[i + 3] = a * 255;
    }
    c.putImageData(img, 0, 0); smokeSprites.push(k);
  }
}

function buildEmberDots() {
  emberDots = Array.from({ length: 26 }, () => ({ d: Math.pow(Math.random(), 1.6), f: rand(-.9, .9), ph: rand(0, 6), s: rand(.6, 1.4) }));
}

// ---------- Brandkante ----------
function edgeOff(f, R) {
  return (0.5 * Math.sin(f * 2.7 + bx * 0.031 + seeds[0]) + 0.35 * Math.sin(f * 6.1 - bx * 0.047 + seeds[1]) + 0.15 * Math.sin(f * 11 + bx * 0.09 + seeds[2])) * R * 0.22;
}
function bodyClip(c, R) {
  c.beginPath();
  c.moveTo(x0, -r0);
  for (let i = 0; i <= 20; i++) { const f = -1 + i / 10; c.lineTo(bx + edgeOff(f, R), f * radius(bx)); }
  c.lineTo(x0, r0); c.closePath();
}

// ---------- Partikel ----------
function emitSmoke(x, y, o) {
  if (smoke.length > 1500) return;
  const v = rand(26, 40), sd = rand(-3, 3);
  smoke.push(Object.assign({ x, y, vx: UX * v - UY * sd, vy: UY * v + UX * sd, s: r1 * rand(.14, .22), gs: r1 * rand(.45, .9), a: rand(.08, .16), life: 0, max: rand(3.5, 6.5), rot: rand(0, 6), vr: rand(-.4, .4), ph: rand(0, 6), sx: 1, v: Math.random() < .25 ? 4 + (Math.random() * 4 | 0) : (Math.random() * 4 | 0) }, o || {}));
}
// Ausatmen: Rauch kommt aus dem Mund (Filter-Ecke), Menge folgt der Lautstärke der Aufnahme
let exhaleT = -1, exhaleLvl = 0, analyser, anaBuf, exhaleBuf = null, exhaleRaw = null;
fetch("ausatmung.mp3").then(r => r.ok ? r.arrayBuffer() : null).then(b => { exhaleRaw = b; decodeExhale(); }).catch(() => {});
function decodeExhale() {
  if (!ac || !exhaleRaw || exhaleBuf) return;
  const raw = exhaleRaw; exhaleRaw = null;
  ac.decodeAudioData(raw, b => exhaleBuf = b, () => {});
}
let exhaleSrc = "file";
function exhale(strength, src = "file") {
  exhaleT = 0; exhaleStrength = strength; exhaleSrc = src;
  if (src === "mic") { analyser = null; return; }     // Menge kommt live vom Pusten
  if (ac && exhaleBuf) {
    const src = ac.createBufferSource(); src.buffer = exhaleBuf;
    analyser = ac.createAnalyser(); analyser.fftSize = 1024; anaBuf = new Float32Array(analyser.fftSize);
    src.connect(analyser); analyser.connect(ac.destination); src.start();
    exhaleDur = exhaleBuf.duration;

  for (let i = 0; i < n; i++) {
    const f = rand(-.8, .8), sp = rand(150, 380), out = rand(0, 90), sc = rand(-70, 70);
    sparks.push({ x: rand(bx, tip) + R * .15, y: f * R, vx: DX * sp + out - DY * sc, vy: DY * sp + DX * sc, r: rand(1, 2.2), life: 0, max: rand(.35, .9), g: 600 });
  }
  heat = Math.min(1.2, heat + .3);   // Glut glimmt kurz auf
}

function finish() {
  state = "out"; drawing = false; pid = null; heat = 0; breathState = "idle"; setCue(""); stopMic();
  if (ac) { crackleGain.gain.setTargetAtTime(0, ac.currentTime, .1); hissGain.gain.setTargetAtTime(0, ac.currentTime, .1); }
  document.getElementById("endtxt").textContent = `${totalDrags} ${totalDrags === 1 ? "Zug" : "Züge"}. Nur noch Crutch übrig.`;
  setTimeout(() => document.getElementById("end").classList.remove("gone"), 1400);
}

// ---------- Eingabe ----------
// Finger an die Glut legen und am Joint entlang Richtung Mundstück ziehen; loslassen = ausatmen
let downAt = 0, downPt = null, pid = null, fingerX = 0, drawFrom = 0, moved = false;
const toFrame = e => frameInv.transformPoint(new DOMPoint(e.clientX, e.clientY));
const nearTip = pt => { const R = radius(bx); return !(pt.x < bx - R * 2.5 || pt.x > ashStart + R * 2 || Math.abs(pt.y) > R * 3.2); };
cv.addEventListener("pointerdown", e => {
  ensureAudio();
  if (state !== "lit" || pid !== null) return;
  const pt = toFrame(e);
  if (!nearTip(pt)) return;   // Ziehen (bzw. Abaschen) nur an der Glut
  pid = e.pointerId; downAt = performance.now(); downPt = pt; moved = false;
  try { cv.setPointerCapture(pid); } catch (er) {}
  if (mode === "finger") { drawing = true; drawTime = 0; drawFrom = bx; fingerX = bx; }
});
cv.addEventListener("pointermove", e => {
  if (e.pointerId !== pid) return;
  const pt = toFrame(e);
  if (Math.hypot(pt.x - downPt.x, pt.y - downPt.y) > 8) moved = true;
  if (mode === "finger") fingerX = Math.max(burnEnd, Math.min(fingerX, pt.x + radius(bx) * .2));
});
const release = e => {
  if (e.pointerId !== pid) return;
  pid = null;
  const quick = performance.now() - downAt < 300 && !moved;
  if (mode === "finger") drawing = false;
  if (quick && downPt.x > bx - radius(bx) * .5 && nearTip(downPt)) { flick(true); return; }
  if (mode !== "finger") return;
  const burnt = drawFrom - bx;
  if (burnt > r1 * .3 || drawTime > .6) { totalDrags++; exhale(clamp(.55 + burnt / (L * .12), .55, 1.3)); }
};
cv.addEventListener("pointerup", release); cv.addEventListener("pointercancel", release);
cv.addEventListener("contextmenu", e => e.preventDefault());

document.getElementById("light").onclick = async () => {
  ensureAudio();
  const motionP = prefKnock ? requestMotion() : Promise.resolve(false);
  if (prefMode === "breath") {
    status("Mikrofon wird angefragt …");
    if (!await startMic()) { status("Kein Mikrofon-Zugriff. Erlaube das Mikrofon für diese Seite (in der Claude-Vorschau geht es nicht) oder wähle Finger."); return; }
  }
  if (prefKnock) {
    if (!await motionP) { stopMic(); status("Kein Zugriff auf den Bewegungssensor. Erlaube „Bewegung & Ausrichtung“ oder schalte Klopfen aus."); return; }
    lastAcc = null; knockThr = 6 - $("knockSens").value * .052;   // 0.8 … 6 m/s² Sprung zwischen zwei Messungen
    addEventListener("devicemotion", onMotion);
  }
  micSens = +$("micSens").value;
  mode = prefMode; knock = prefKnock; status("");
  document.getElementById("start").classList.add("gone");
  state = "lighting"; lightT = 0;
  try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
};
document.getElementById("again").onclick = () => {
  document.getElementById("end").classList.add("gone");
  bx = burnStart; ashStart = bx; heat = 0; totalDrags = 0; smoke = []; ashFall = [];
  stopMic(); removeEventListener("devicemotion", onMotion); mode = "finger"; knock = false;
  state = "unlit";
  document.getElementById("start").classList.remove("gone");
};
document.getElementById("flip").onclick = () => { orient = (orient + 1) % 2; buildFrame(); };
document.getElementById("fs").onclick = () => {
  const el = document.documentElement;
  try { (document.fullscreenElement ? document.exitFullscreen() : (el.requestFullscreen || el.webkitRequestFullscreen).call(el))?.catch?.(() => {}); } catch (e) {}
};
// ---------- Einstellungen (nur im Startbildschirm, gelten für die ganze Runde) ----------
const $ = id => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem("joint." + k); return v === null ? d : v; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem("joint." + k, v); } catch (e) {} } };
let mode = "finger", knock = false;
let prefMode = store.get("mode", "finger"), prefKnock = store.get("knock", "0") === "1";
let micSens = +store.get("micSens", 40);      // wird beim Anzünden für die Runde festgelegt
$("micSens").value = micSens;
$("micSens").oninput = () => store.set("micSens", $("micSens").value);
$("micHudOn").checked = store.get("micHud", "0") === "1";
$("micHudOn").onchange = () => store.set("micHud", $("micHudOn").checked ? "1" : "0");
$("knockSens").value = store.get("knockSens", 55);
$("knockSens").oninput = () => store.set("knockSens", $("knockSens").value);
const status = t => { $("status").textContent = t || ""; };
function setSeg(a, b, on) { $(a).setAttribute("aria-checked", !on); $(b).setAttribute("aria-checked", on); }
const HELP = {
  finger: "Handyecke mit dem Filter an die Lippen. Finger auf die Glut legen und am Joint entlang Richtung Mundstück wischen, er brennt so weit ab, wie du ziehst. Loslassen zum Ausatmen. Kurz auf die Asche tippen zum Abaschen.",
  breath: "Handyecke mit dem Filter an die Lippen. Hörbar Luft einziehen, der Joint brennt, solange du ziehst. Du kannst mehrmals hintereinander ziehen. Erst wenn du reinpustest, atmest du aus. Kurz auf die Asche tippen zum Abaschen.",
};
function showPrefs() {
  setSeg("modeFinger", "modeBreath", prefMode === "breath"); $("micOpts").hidden = prefMode !== "breath";
  setSeg("knockOff", "knockOn", prefKnock); $("knockOpts").hidden = !prefKnock;
  $("help").textContent = HELP[prefMode];
}
$("modeFinger").onclick = () => { prefMode = "finger"; store.set("mode", prefMode); showPrefs(); status(""); };
$("modeBreath").onclick = () => { prefMode = "breath"; store.set("mode", prefMode); showPrefs(); status(""); };
$("knockOff").onclick = () => { prefKnock = false; store.set("knock", "0"); showPrefs(); status(""); };
$("knockOn").onclick = () => { prefKnock = true; store.set("knock", "1"); showPrefs(); status(""); };
showPrefs();

// Atem-Steuerung über das Mikrofon
let micStream = null, micAna = null, micBins, micFloor = 1e-7, micInt = 0, micLastOn = 0, micDb = 0, micOnTime = 0;
async function startMic() {
  if (!ac || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
  setAudioSession("play-and-record");
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  } catch (e) { setAudioSession("playback"); return false; }
  // Safari liefert über einen Audio-Kontext, der vor der Mikro-Freigabe entstand, oft nur Stille
  // (andere Abtastrate nach dem Umschalten auf Aufnahme). Deshalb danach frisch anlegen.
  try { await ac.close(); } catch (e) {}
  ac = null; initAudio();
  if (!ac) return false;
  try { await ac.resume(); } catch (e) {}
  const src = ac.createMediaStreamSource(micStream);
  micAna = ac.createAnalyser(); micAna.fftSize = 1024; micAna.smoothingTimeConstant = .5;
  micBins = new Float32Array(micAna.frequencyBinCount);
  src.connect(micAna);
  micFloor = 1e-7; loFloor = 1e-7; totFloor = 1e-7; breathState = "idle"; micOnTime = 0; lungs = 0;
  micHud = $("micHudOn").checked; $("micHud").hidden = !micHud;
  return true;
}
function stopMic() {
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (micStream) setAudioSession("playback");
  micStream = null; micAna = null; micInt = 0; micBlow = 0; breathState = "idle"; lungs = 0; setCue(""); $("micHud").hidden = true;
  if (exhaleSrc === "mic") exhaleT = -1;
}
// Atem-Modus: Jedes Geräusch wird laufend eingeordnet:
//  Ziehen  = helles Zischen (Schwerpunkt hoch, wenig Tiefen)  -> Joint brennt, Rauch sammelt sich in der Lunge
//  Pusten  = Wind-Rumpeln am Mikro (Schwerpunkt tief)          -> Ausatmen, solange Rauch in der Lunge ist
// Beliebig viele Züge hintereinander sind möglich, ausgeatmet wird erst beim Pusten.
let breathState = "idle", micLo = 0, micHi = 0, micTot = 0, loFloor = 1e-7, totFloor = 1e-7, micBlow = 0;
let evStart = 0, lungsBefore = 0, micOnSince = 0, micPrevSig = false, lungs = 0, lungsAt = 0, blowScore = .5, centroid = 0, lastBxBreath = 0, micHud = false;
function setCue(t) { $("cue").hidden = !t; $("cue").textContent = t || ""; }
function bandPower(lo, hi) {
  const hz = ac.sampleRate / micAna.fftSize; let p = 0;
  for (let i = Math.max(1, Math.floor(lo / hz)); i < Math.min(micBins.length, Math.floor(hi / hz)); i++) p += Math.pow(10, micBins[i] / 10);
  return p;
}
function track(fl, v, dt) { fl = v < fl ? fl + (v - fl) * Math.min(1, dt * 3) : fl * (1 + dt * .08); return Math.max(fl, 1e-9); }
function breathStep(dt) {
  if (!micAna) return;
  micAna.getFloatFrequencyData(micBins);
  const hz = ac.sampleRate / micAna.fftSize;
  const lo = bandPower(40, 400), mid = bandPower(400, 1500), hi = bandPower(1500, 9000), tot = lo + mid + hi;
  // spektraler Schwerpunkt 100 Hz … 9 kHz
  let sw = 0, sp = 0;
  for (let i = Math.floor(100 / hz); i < Math.min(micBins.length, Math.floor(9000 / hz)); i++) { const pw = Math.pow(10, micBins[i] / 10); sw += pw * i * hz; sp += pw; }
  centroid = sp > 0 ? sw / sp : 0;

  const thr = 22 - micSens * .17;                    // 5 … 22 dB über dem Grundrauschen
  if (breathState === "idle") { micFloor = track(micFloor, hi, dt); loFloor = track(loFloor, lo, dt); totFloor = track(totFloor, tot, dt); }
  micHi = 10 * Math.log10(hi / micFloor); micLo = 10 * Math.log10(lo / loFloor); micTot = 10 * Math.log10(tot / totFloor);
  micDb = Math.max(micHi, micLo, micTot);
  const sig = micDb > thr;
  const now = performance.now();
  const wasSilent = !micPrevSig && now - micLastOn > 120; micPrevSig = sig;
  if (sig) micLastOn = now;
  const silentFor = now - micLastOn;

  if (sig) {
    // 0 = Ziehen, 1 = Pusten
    const byCentroid = clamp((2200 - centroid) / 1600, 0, 1);
    const byBands = clamp((micLo - micHi) / 12 + .5, 0, 1);
    const raw = byCentroid * .6 + byBands * .4;
    blowScore = wasSilent ? raw : blowScore + (raw - blowScore) * Math.min(1, dt * 8);
  }
  if (sig && wasSilent) micOnSince = now;
  micOnTime = sig ? (now - micOnSince) / 1000 : 0;   // echte Zeit, unabhängig von der Bildrate
  const drawRaw = clamp((micDb - thr) / 14, 0, 1);
  const blowRaw = clamp((micTot - thr) / 14, 0, 1.4);

  if (breathState === "idle") {
    if (micOnTime > .12 && state === "lit") {
      // Ziehen ist der Normalfall. Pusten zählt nur, wenn Rauch in der Lunge ist UND der Klang eindeutig nach Pusten klingt.
      breathState = lungs > .05 && blowScore > .7 ? "blow" : "draw";
      if (breathState === "draw") { drawing = true; drawTime = 0; drawFrom = bx; lastBxBreath = bx; evStart = now; lungsBefore = lungs; }
    }
  } else if (breathState === "draw") {
    lungs += Math.max(0, lastBxBreath - bx) / (L * .08); lastBxBreath = bx; lungsAt = now;
    if (silentFor > 300) { drawing = false; breathState = "idle"; if (drawFrom - bx > r1 * .15) totalDrags++; }
    else if (now - evStart > 6000) {
      // so lange zieht niemand: das ist Dauerlärm, als neues Grundrauschen übernehmen
      drawing = false; breathState = "idle"; micFloor = hi; loFloor = lo; totFloor = tot;
    }
    else if (lungsBefore > .05 && blowScore > .85) { drawing = false; breathState = "blow"; if (drawFrom - bx > r1 * .15) totalDrags++; }
  } else if (breathState === "blow") {
    lungsAt = now;
    if (lungs > 0 && exhaleT < 0) exhale(1, "mic");
    if (lungs > 0) { exhaleStrength = clamp(.55 + lungs * .5, .55, 1.6); lungs = Math.max(0, lungs - dt * micBlow * .3); }
    else if (exhaleSrc === "mic") exhaleT = -1;
    if (silentFor > 350) { breathState = "idle"; if (exhaleSrc === "mic") exhaleT = -1; }
    else if (blowScore < .45 && state === "lit") { breathState = "draw"; drawing = true; drawTime = 0; drawFrom = bx; lastBxBreath = bx; evStart = now; lungsBefore = lungs; if (exhaleSrc === "mic") exhaleT = -1; }
  }
  micInt += ((breathState === "draw" ? drawRaw : 0) - micInt) * Math.min(1, dt * 10);
  micBlow += ((breathState === "blow" && lungs > 0 ? blowRaw : 0) - micBlow) * Math.min(1, dt * 10);
  if (lungs > 0 && now - lungsAt > 25000) lungs = 0;   // zu lange angehalten: Rauch ist weg
  setCue(lungs > .05 && breathState !== "blow" && breathState !== "draw" ? "Reinpusten zum Ausatmen" : "");
  if (micHud) $("micHud").textContent =
    `${{ idle: "Ruhe", draw: "Ziehen", blow: "Pusten" }[breathState]} · Schwerpunkt ${(centroid / 1000).toFixed(1)} kHz · tief ${micLo | 0} dB / hoch ${micHi | 0} dB · Puste-Wert ${blowScore.toFixed(2)} · Lunge ${lungs.toFixed(1)} · Audio ${ac.state}`;
}

// Klopfen auf den Rahmen = Ruck im Beschleunigungssensor; Empfindlichkeit wird beim Anzünden festgelegt
let lastAcc = null, lastKnock = 0, knockThr = 3;
function onMotion(e) {
  const a = e.accelerationIncludingGravity || e.acceleration;
  if (!a || a.x === null) return;
  const v = [a.x, a.y, a.z];
  if (lastAcc) {
    const jerk = Math.hypot(v[0] - lastAcc[0], v[1] - lastAcc[1], v[2] - lastAcc[2]);
    const now = performance.now();
    if (jerk > knockThr && now - lastKnock > 450) {
      lastKnock = now;
      if (state === "lit") flick(true);
    }
  }
  lastAcc = v;
}
function requestMotion() {
  // muss direkt im Tipp auf "Anzünden" passieren, sonst fragt das iPhone nicht
  try {
    if (typeof DeviceMotionEvent === "undefined") return Promise.resolve(false);
    if (typeof DeviceMotionEvent.requestPermission === "function") return DeviceMotionEvent.requestPermission().then(r => r === "granted", () => false);
    return Promise.resolve(true);
  } catch (e) { return Promise.resolve(false); }
}

addEventListener("resize", resize);
resize();
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt, now / 1000); render(now / 1000);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

</body>
</html>
