<title>Couch-Duell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: ein Bildschirm wie ein Wohnzimmer-TV – oben Scoreboard, Mitte "Bühne", unten zwei riesige Buzzer (links/rechts = Couchplatz) */
:root {
  --bg: #16121f;        /* abends, Licht aus */
  --stage: #221b30;
  --ink: #f3ecdf;
  --muted: #9d92b0;
  --p1: #ff7a45;        /* Couch links */
  --p2: #4cc3ff;        /* Couch rechts */
  --go: #7cf28a;
  --bad: #ff4d6d;
  --display: "Bungee", "Impact", system-ui, sans-serif;
  --body: "Rubik", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
#app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 12px; padding-block: 12px; padding-inline: 16px; max-width: 1100px; margin: 0 auto; }

header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.score { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.score.r { text-align: right; align-items: flex-end; }
.score .name { font-weight: 800; font-size: clamp(14px, 2.4vw, 20px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.score .pts { font-family: var(--display); font-size: clamp(34px, 7vw, 64px); line-height: 1; font-variant-numeric: tabular-nums; }
.l .name, .l .pts { color: var(--p1); }
.r .name, .r .pts { color: var(--p2); }
.vs { font-family: var(--display); color: var(--muted); font-size: clamp(12px, 2vw, 16px); text-align: center; letter-spacing: .08em; }
.vs small { display: block; font-family: var(--body); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; margin-top: 4px; }

#stage { position: relative; background: var(--stage); border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; overflow: hidden; transition: background .08s; min-height: 0; }
#stage.go { background: var(--go); color: #10210f; }
#stage.foul { background: var(--bad); }
#rule { font-size: clamp(14px, 2.4vw, 20px); color: var(--muted); font-weight: 600; letter-spacing: .02em; min-height: 1.4em; }
#stage.go #rule { color: #10210f; }
#big { font-family: var(--display); font-size: clamp(44px, 13vw, 140px); line-height: 1; margin-block: 14px; text-wrap: balance; word-break: break-word; }
#sub { font-size: clamp(15px, 2.6vw, 22px); max-width: 34ch; text-wrap: balance; line-height: 1.35; min-height: 2.7em; }
#sub b { font-weight: 800; }
.ms { font-family: var(--mono); }

#setup { display: flex; flex-direction: column; gap: 14px; align-items: center; width: 100%; max-width: 520px; }
#setup h1 { font-family: var(--display); font-size: clamp(36px, 9vw, 72px); margin: 0; line-height: .95; }
#setup h1 span:first-child { color: var(--p1); }
#setup h1 span:last-child { color: var(--p2); }
#setup p { margin: 0; color: var(--muted); line-height: 1.45; max-width: 44ch; }
.names { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.names label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); text-align: left; }
.names input { font: 600 18px var(--body); padding: 10px 12px; border-radius: 12px; border: 2px solid var(--muted); background: var(--bg); color: var(--ink); width: 100%; min-width: 0; }
#n1 { border-color: var(--p1); } #n2 { border-color: var(--p2); }
.btn { font: 16px var(--display); letter-spacing: .04em; padding: 14px 28px; border-radius: 999px; border: 0; background: var(--ink); color: var(--bg); cursor: pointer; }
.btn:focus-visible, .names input:focus-visible, .pad:focus-visible { outline: 3px solid var(--go); outline-offset: 3px; }
kbd { font-family: var(--mono); background: var(--bg); border: 1px solid var(--muted); border-radius: 6px; padding: 1px 6px; color: var(--ink); }

footer { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pad { height: clamp(90px, 18vh, 160px); border-radius: 22px; border: 0; cursor: pointer; font: clamp(16px, 3vw, 24px) var(--display); color: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 8px 0 rgba(0,0,0,.45); transition: transform .05s, box-shadow .05s; touch-action: none; }
.pad small { font: 600 12px var(--body); opacity: .75; letter-spacing: .06em; }
.pad.p1 { background: var(--p1); } .pad.p2 { background: var(--p2); }
.pad.hit { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,.45); }

.confetti { position: absolute; width: 10px; height: 14px; top: -20px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
@media (prefers-reduced-motion: reduce) { .shake, .confetti { animation: none; } }
</style>

<div id="app">
  <header>
    <div class="score l"><span class="name" id="s1n">Spieler 1</span><span class="pts" id="s1">0</span></div>
    <div class="vs">VS<small id="round">Bis 5 Punkte</small></div>
    <div class="score r"><span class="name" id="s2n">Alex</span><span class="pts" id="s2">0</span></div>
  </header>

  <main id="stage">
    <div id="setup">
      <h1><span>COUCH</span>-<span>DUELL</span></h1>
      <p>Zwei Leute, ein Bildschirm, null Würde. Drückt nur, wenn das Richtige kommt. Wer zu früh drückt, schenkt dem anderen den Punkt. Wer zuerst 5 Punkte hat, gewinnt, und der Verlierer bekommt eine Strafe.</p>
      <div class="names">
        <label for="n1">Links (Taste <kbd>A</kbd>)<input id="n1" maxlength="14" value="Ich"></label>
        <label for="n2">Rechts (Taste <kbd>L</kbd>)<input id="n2" maxlength="14" value="Alex"></label>
      </div>
      <button class="btn" id="start">Duell starten</button>
      <p style="font-size:13px">Auf dem Handy: Jeder tippt auf seinen Buzzer unten.</p>
    </div>
    <div id="play" hidden>
      <div id="rule"></div>
      <div id="big"></div>
      <div id="sub"></div>
    </div>
  </main>

  <footer>
    <button class="pad p1" id="pad1"><span id="pad1n">Ich</span><small>Taste A</small></button>
    <button class="pad p2" id="pad2"><span id="pad2n">Alex</span><small>Taste L</small></button>
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b) => a + Math.random() * (b - a);
const WIN = 5;

let names = ["Ich", "Alex"], score = [0, 0], roundNo = 0;
let phase = "setup";   // setup | intro | waiting | target | result | over
let targetAt = 0, timers = [], lastTypes = [], resultAt = 0;

// ---------- Sound ----------
let ac;
function beep(f, d = .12, type = "square", v = .08) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = v;
    o.connect(g); g.connect(ac.destination);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d);
    o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}
const sfx = {
  tick: () => beep(220, .05, "triangle", .05),
  go: () => beep(880, .15),
  win: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .15), i * 90)),
  foul: () => beep(110, .4, "sawtooth", .1),
  fanfare: () => [392, 523, 659, 784, 659, 784].forEach((f, i) => setTimeout(() => beep(f, .2, "square", .07), i * 140)),
};

// ---------- Rundentypen ----------
const COLORS = { ROT: "#ff4d6d", BLAU: "#4cc3ff", GELB: "#ffd23f", LILA: "#b388ff", GRÜN: "#7cf28a" };
const TYPES = [
  {
    rule: "Drück bei <b>JETZT!</b>",
    decoys: () => pick(["noch nicht…", "gleich…", "psst", "JETZ", "JEZT!", "fast…", "warte…", "JETTZ!", "nö", "LOS ANGELES"]),
    target: () => ({ text: "JETZT!" }),
  },
  {
    rule: "Drück bei der <b>Kartoffel</b>",
    decoys: () => pick(["🍠", "🧅", "🥜", "🍞", "🧄", "🥐", "🪨", "🍟", "🥚"]),
    target: () => ({ text: "🥔" }),
  },
  {
    rule: "Drück, wenn die <b>Schrift grün</b> ist (nicht das Wort!)",
    decoys: () => { const w = pick(Object.keys(COLORS)); const c = pick(["ROT", "BLAU", "GELB", "LILA"]); return { text: w, color: COLORS[c] }; },
    target: () => ({ text: pick(["ROT", "BLAU", "GELB", "LILA"]), color: COLORS.GRÜN }),
  },
  {
    rule: "Drück, wenn das Ergebnis <b>10</b> ist",
    decoys: () => { let a, b; do { a = 1 + Math.floor(Math.random() * 9); b = 1 + Math.floor(Math.random() * 9); } while (a + b === 10); return pick([`${a} + ${b}`, `${a + b + 1} − 1`, `2 × ${pick([3, 4, 6, 7])}`, "11", "9", "1 0"]); },
    target: () => ({ text: pick(["3 + 7", "2 × 5", "15 − 5", "20 ÷ 2", "6 + 4", "√100"]) }),
  },
  {
    rule: "Drück beim <b>Hund</b>",
    decoys: () => pick(["🐱", "🦊", "🐺", "🐻", "🐹", "🌭", "🦝", "🐑"]),
    target: () => ({ text: pick(["🐶", "🐕"]) }),
  },
];

// ---------- Sprüche ----------
const WIN_LINES = [
  "<b>{w}</b> war schneller. {l} hat noch geladen.",
  "<b>{w}</b> gewinnt die Runde. {l} hat nur geblinzelt.",
  "{l} hat gedrückt, aber leider erst nach <b>{w}</b>.",
  "<b>{w}</b> ist sauber durch. {l} hat zugeschaut.",
  "Punkt für <b>{w}</b>. {l}, das war knapp, aber verloren ist verloren.",
];
const FOUL_LINES = [
  "<b>{f}</b> hat zu früh gedrückt. Danke für den Punkt, sagt {o}.",
  "Fehlstart von <b>{f}</b>. Das war nicht mal ansatzweise das Richtige.",
  "<b>{f}</b> drückt einfach mal auf Verdacht. {o} bedankt sich.",
  "Ganz ruhig, <b>{f}</b>. Das war {o}s Punkt, jetzt mit Geschenkpapier.",
  "<b>{f}</b> hat die Regel nicht gelesen. Oder nicht verstanden.",
];
const SLEEP_LINES = ["Keiner hat gedrückt. Seid ihr eingeschlafen?", "Hallo? Das war es. Kein Punkt für niemanden.", "Beide eingefroren. Nächste Runde."];
const PUNISH = [
  "holt die nächsten Snacks.",
  "macht die nächste Runde Getränke.",
  "darf heute die Fernbedienung nicht anfassen.",
  "muss den Sieger 30 Sekunden lang ernsthaft loben.",
  "räumt die Couch auf.",
  "sagt laut: „Ich bin langsamer als ein Toaster.“",
  "zahlt die nächste Pizza (anteilig ist Verhandlungssache).",
  "muss die nächste Partie mit der falschen Hand spielen.",
];
function msComment(ms) {
  if (ms < 200) return "Verdächtig schnell. Doping?";
  if (ms < 300) return "Reflexe wie eine Katze.";
  if (ms < 450) return "Solide.";
  if (ms < 700) return "Gemütlich.";
  return "Das war eher ein Nickerchen.";
}
const fill = (s, m) => s.replace(/\{(\w)\}/g, (_, k) => m[k]);

// ---------- Ablauf ----------
function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
function stageClass(c) { $("stage").className = c || ""; }
function show(rule, big, sub, color) {
  $("rule").innerHTML = rule; $("big").textContent = big; $("sub").innerHTML = sub || "";
  $("big").style.color = color || "";
}
function updateScore() {
  $("s1").textContent = score[0]; $("s2").textContent = score[1];
  $("round").textContent = roundNo ? `Runde ${roundNo} · bis ${WIN}` : `Bis ${WIN} Punkte`;
}

function startGame() {
  names = [$("n1").value.trim() || "Links", $("n2").value.trim() || "Rechts"];
  $("s1n").textContent = $("pad1n").textContent = names[0];
  $("s2n").textContent = $("pad2n").textContent = names[1];
  score = [0, 0]; roundNo = 0;
  $("setup").hidden = true; $("play").hidden = false;
  nextRound();
}

function nextRound() {
  clearTimers(); stageClass("");
  roundNo++; updateScore();
  let pool = TYPES.filter(t => !lastTypes.includes(t));
  const type = pick(pool.length ? pool : TYPES);
  lastTypes = [type, ...lastTypes].slice(0, 2);
  phase = "intro";
  show(`Runde ${roundNo}`, "BEREIT?", type.rule);
  later(() => runSequence(type), 2200);
}

function runSequence(type) {
  phase = "waiting";
  const n = 2 + Math.floor(Math.random() * 6);
  let t = 0;
  for (let i = 0; i < n; i++) {
    t += rnd(550, 1200);
    later(() => {
      const d = type.decoys(); const o = typeof d === "string" ? { text: d } : d;
      show(type.rule, o.text, "", o.color); sfx.tick();
    }, t);
  }
  t += rnd(600, 1300);
  later(() => {
    const o = type.target();
    show(type.rule, o.text, "", o.color);
    stageClass(type === TYPES[0] ? "go" : "");
    phase = "target"; targetAt = performance.now(); sfx.go();
    later(() => {
      if (phase !== "target") return;
      phase = "result"; resultAt = performance.now(); stageClass("");
      show(type.rule, "😴", pick(SLEEP_LINES) + "<br><small>Tippe oder Leertaste für weiter</small>");
      later(nextRound, 3000);
    }, 2500);
  }, t);
}

function press(p) {
  const padEl = $(p === 0 ? "pad1" : "pad2");
  padEl.classList.add("hit"); setTimeout(() => padEl.classList.remove("hit"), 120);
  if (phase === "setup") return;
  if (phase === "result") { skipResult(); return; }
  if (phase === "over") return;
  const o = 1 - p;
  if (phase === "target") {
    const ms = Math.round(performance.now() - targetAt);
    clearTimers(); score[p]++; phase = "result"; sfx.win();
    stageClass("");
    show(`${msComment(ms)}`, `${names[p]} +1`,
      fill(pick(WIN_LINES), { w: names[p], l: names[o] }) + ` <span class="ms">(${ms} ms)</span>`, p ? "var(--p2)" : "var(--p1)");
  } else if (phase === "waiting" || phase === "intro") {
    clearTimers(); score[o]++; phase = "result"; sfx.foul();
    stageClass("foul"); $("stage").classList.add("shake");
    show("FEHLSTART", `${names[o]} +1`, fill(pick(FOUL_LINES), { f: names[p], o: names[o] }));
  } else return;
  resultAt = performance.now();
  updateScore();
  if (score[p] >= WIN || score[o] >= WIN) later(gameOver, 1800);
  else later(nextRound, 3000);
}

function skipResult() {
  if (performance.now() - resultAt < 900) return; // kein versehentliches Weiterklicken beim Buzzern
  clearTimers();
  if (Math.max(...score) >= WIN) gameOver(); else nextRound();
}

function gameOver() {
  clearTimers(); phase = "over"; stageClass("");
  const w = score[0] > score[1] ? 0 : 1, l = 1 - w;
  sfx.fanfare(); confetti(w);
  show(`${score[w]} : ${score[l]}`, `${names[w]} gewinnt!`,
    `<b>${names[l]}</b> ${pick(PUNISH)}<br><br><button class="btn" id="again">Revanche</button>`, w ? "var(--p2)" : "var(--p1)");
  $("again").onclick = () => { score = [0, 0]; roundNo = 0; nextRound(); };
}

function confetti(w) {
  const cols = [w ? "#4cc3ff" : "#ff7a45", "#f3ecdf", "#7cf28a", "#ffd23f"];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "%";
    c.style.background = pick(cols);
    c.style.animationDuration = rnd(1.5, 3.5) + "s";
    c.style.animationDelay = rnd(0, .8) + "s";
    $("stage").appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}

// ---------- Eingabe ----------
$("start").onclick = startGame;
$("pad1").addEventListener("pointerdown", e => { e.preventDefault(); press(0); });
$("pad2").addEventListener("pointerdown", e => { e.preventDefault(); press(1); });
$("stage").addEventListener("animationend", () => $("stage").classList.remove("shake"));
document.addEventListener("keydown", e => {
  if (e.repeat || e.target.tagName === "INPUT") { if (e.key === "Enter" && phase === "setup") startGame(); return; }
  const k = e.key.toLowerCase();
  if (k === "a") press(0);
  else if (k === "l") press(1);
  else if (k === " " && phase === "result") { e.preventDefault(); skipResult(); }
  else if (k === "enter" && phase === "setup") startGame();
});
updateScore();
</script>
